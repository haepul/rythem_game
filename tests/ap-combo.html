<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERFECT / AP combo — Engine 검증</title>
<link rel="stylesheet" href="../next-stage/style.css"><link id="hud-css" rel="stylesheet" href="../next-stage/play-hud.css?v=20261029-ap-combo">
<style>#controls{position:fixed;z-index:20;bottom:0;background:#f8faffee;color:#25243b;padding:6px;display:flex;gap:8px;flex-wrap:wrap;font:12px Arial}#controls[hidden]{display:none}#controls button,#controls select{font:inherit;background:white;color:#25243b;padding:5px;border:1px solid #888}#status{flex-basis:100%}body.capture #combo::before{animation-play-state:paused!important;animation-delay:-1.75s!important}body.capture #combo::after{animation-play-state:paused!important;animation-delay:-1.82s!important}body.capture #combo b{animation-play-state:paused!important}</style>
<nav id="controls"><label>Scene <select id="scene"><option value="ap100">100 PERFECT</option><option value="break99">99 PERFECT + GREAT</option><option value="aftergreat">GREAT then 100 PERFECT</option><option value="aftermiss">MISS then 100 PERFECT</option><option value="four">4 simultaneous PERFECT</option><option value="mixed">Simultaneous GREAT + PERFECT</option><option value="hold-mid">HOLD</option><option value="slide">SLIDE</option><option value="holdmiss">HOLD middle MISS</option><option value="slidemiss">SLIDE middle MISS</option><option value="master">Actual MASTER</option></select></label><label><input id="effects" type="checkbox" checked>Effects</label><label><input id="reduced" type="checkbox">Reduced motion</label><button id="break">Next GREAT</button><button id="restart">Restart scene</button><button id="measure">Measure HUD</button><button id="frames">Measure 240 frames</button><output id="status">Loading</output></nav>
<script src="../next-stage/vendor/pixi.min.js"></script><script type="module">
import {Stage} from '../next-stage/renderer.mjs?v=20261029-beat-guides';
import {apScene} from './ap-combo-scenes.mjs';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),before=q.has('before');
if(before)$('hud-css').href='fixtures/ap-combo-before.css';
const {PlayHUD}=await import(before?'./fixtures/ap-combo-before.mjs':'../next-stage/play-hud.mjs?v=20261029-ap-combo');
const html=await(await fetch('../next-stage/index.html?fixture=ap-combo')).text(),play=new DOMParser().parseFromString(html,'text/html').getElementById('play');document.body.append(play);play.hidden=false;
$('count-in').hidden=true;$('pause-button').hidden=true;$('playing-title').textContent='PERFECT / COMBO';$('playing-level').textContent='ACTUAL ENGINE · SILENT FIXTURE';
const hud=new PlayHUD(),stage=new Stage();await stage.init($('stage-host'));stage.app.renderer.resize(800,480,Number(q.get('resolution')||1));
const master=await(await fetch('../next-stage/data/21-master-full.json')).json();let scene;
$('scene').value=q.get('scene')||'ap100';$('effects').checked=q.get('effects')!=='0';$('reduced').checked=q.has('reduced');$('controls').hidden=q.has('capture');document.body.classList.toggle('capture',q.has('capture'));
const effects=()=>$('effects').checked&&!$('reduced').checked;
function update(){stage.draw(scene.engine,scene.now,.55,165,0,effects());hud.update(scene.engine,scene.now,300,effects());}
function freeze(){for(const [k,a]of Object.entries(hud.animations)){a.pause();a.currentTime=k==='judgment'?100:k==='ap-change'?55:130;}}
function status(){ $('status').textContent=JSON.stringify({scene:$('scene').value,combo:scene.engine.combo,counts:scene.engine.counts,last:scene.engine.feedback,ap:$('combo').dataset.ap,motion:$('combo').dataset.motion,resolution:stage.app.renderer.resolution,browserDPR:devicePixelRatio});}
function rebuild(){document.body.classList.toggle('reduced',!effects());hud.reset();scene=apScene($('scene').value,(e,t)=>hud.update(e,t,300,effects()),master);update();freeze();status();}
for(const id of ['scene','effects','reduced'])$(id).onchange=rebuild;$('restart').onclick=rebuild;
$('break').onclick=()=>{const n=scene.engine.notes.find(n=>!n.hit&&n.type==='TAP'&&n.time>scene.now);if(!n)return;const t=n.time+.1,key=['KeyD','KeyF','KeyJ','KeyK'][n.lane];scene.engine.step(t,[['key','up',key,t-.001],['key','down',key,t]]);scene.now=t+.055;update();freeze();status();};
$('measure').onclick=()=>{update();const samples=[],obs=new MutationObserver(()=>{});obs.observe(play,{subtree:true,attributes:true,childList:true,characterData:true});for(let i=0;i<10000;i++){const t=performance.now();hud.update(scene.engine,scene.now,300,effects());samples.push(performance.now()-t);}const mutations=obs.takeRecords().length;obs.disconnect();samples.sort((a,b)=>a-b);$('status').textContent=JSON.stringify({before,updates:10000,mean:samples.reduce((a,b)=>a+b,0)/samples.length,p95:samples[9500],mutations});};
$('frames').onclick=async()=>{$('frames').disabled=true;$('status').dataset.measured='false';document.body.classList.remove('capture');let prev;const times=[];for(let i=0;i<260;i++){const t=await new Promise(requestAnimationFrame);update();if(i>=20)times.push(t-prev);prev=t;}times.sort((a,b)=>a-b);const mean=times.reduce((a,b)=>a+b,0)/times.length;$('status').textContent=JSON.stringify({before,frames:240,mean,p95:times[228],fps:1000/mean});$('status').dataset.measured='true';$('frames').disabled=false;};
rebuild();
</script></html>
