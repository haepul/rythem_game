<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAY 8–10 격리 추첨·공개·결과 검증</title>
<link rel="stylesheet" href="../next-stage/style.css"><link rel="stylesheet" href="../next-stage/ui-system.css"><link rel="stylesheet" href="../next-stage/gacha.css?v=20261108-day13">
<style>#home{display:block;padding:16px}#controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:white}#controls button,#reveal-controls button{min-height:44px}#reveal-controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px}html.zoomed #home{zoom:2}#intro-trace,#evidence{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px}</style>
<div id="controls"><button id="seed">시험 데이터: v1 잔액 3,000</button><button id="zero">시험 데이터: 초기 0</button><button id="corrupt">시험 데이터: 손상</button><button id="future">시험 데이터: 미래 버전</button><label><input id="fail" type="checkbox">쓰기 실패</label><label><input id="delay" type="checkbox">잠금 3초 지연</label><label><input id="zoom" type="checkbox">CSS 200% 확대</label><label><input id="motion" type="checkbox">효과 OFF</label><button id="show">메뉴 다시 열기</button></div>
<div id="intro-controls"><label><input id="observe" type="checkbox">연출 관찰 10배 시간 (시험 전용)</label><label><input id="intro-error" type="checkbox">집중 단계 연출 오류 (시험 전용)</label><label><input id="mid-off" type="checkbox">600ms 후 효과 OFF (시험 전용)</label></div>
<div id="reveal-controls"><button data-fixed="R2">고정 R2 저장</button><button data-fixed="R3">고정 R3 저장</button><button data-fixed="R4">고정 R4 저장</button><button data-fixed="ten">고정 10장 저장</button><label><input id="reveal-error" type="checkbox">카드 공개 오류</label><label><input id="reveal-off" type="checkbox">공개 100ms 후 효과 OFF</label><label><input id="reveal-exit" type="checkbox">공개 후 메뉴 이탈</label></div>
<div id="result-controls"><label><input id="owned" type="checkbox">고정 데이터에 이전 R2 획득 포함</label><label><input id="replay" type="checkbox" checked>고정 결과 공개 재연출 (시험 전용)</label><button id="append">다른 탭 시험: 후속 R4 기록 추가</button><button data-fixed="retired">긴 폐기 카드 ID 저장</button></div>
<p>시험 전용 키 rhythm-next-day7-flow-fixture만 사용합니다. 운영 기록·잔액을 읽거나 변경하지 않습니다.</p><pre id="intro-trace" aria-label="연출 시험 기록"></pre>
<div id="home" class="menu-shell"><main id="gacha-screen" class="gacha-screen"></main></div><pre id="evidence" aria-label="시험 저장 요약"></pre>
<script type="module">
import {mountGachaView} from '../next-stage/gacha/view.mjs?v=20261108-day13';
import {createWalletStore} from '../next-stage/gacha/wallet-storage.mjs?v=20261108-day13';
import {createDrawService} from '../next-stage/gacha/draw-service.mjs?v=20261108-day13';
import {INTRO_TIMING} from '../next-stage/gacha/intro-sequence.mjs?v=20261108-day13';
import {drawTransaction} from '../next-stage/gacha/acquisition-history.mjs?v=20261108-day13';
const key='rhythm-next-day7-flow-fixture',$=id=>document.getElementById(id);
let writes=0,rolls=0,confirms=0,fixedRequestId=null;const phases=[],visibility=[],revealed=[];
const storage={getItem:k=>localStorage.getItem(k),setItem(k,v){if($('fail').checked){$('fail').checked=false;throw new DOMException('fixture quota','QuotaExceededError');}localStorage.setItem(k,v);writes++;}};
const locks={request:(n,o,fn)=>navigator.locks.request(n,o,async()=>{if($('delay').checked)await new Promise(r=>setTimeout(r,3000));return fn();})};
const store=createWalletStore({key,storage,locks});
const drawService=createDrawService({store,idFactory:()=>fixedRequestId??crypto.randomUUID(),rng:()=>{rolls++;if(fixedRequestId)throw Error('Fixed receipt must never sample');return Math.random();}}),originalConfirm=drawService.confirm;
// Presentation-only replay of a PRE-SAVED fixed receipt. No changed override in production.
drawService.confirm=async()=>{confirms++;const r=await originalConfirm();return fixedRequestId&&r.ok&&$('replay').checked?{...r,changed:true}:r;};
const timing=Object.fromEntries(Object.keys(INTRO_TIMING).map(phase=>[phase,0]));for(const phase of Object.keys(timing))Object.defineProperty(timing,phase,{get:()=>INTRO_TIMING[phase]*($('observe').checked?10:1)});
const trace=()=>{$('intro-trace').textContent=JSON.stringify({writes,rolls,confirms,phases,visibility,revealed});};
const view=mountGachaView($('gacha-screen'),()=>{view.setVisible(false);$('gacha-screen').hidden=true;},{walletStore:store,drawService,effects:()=>!$('motion').checked,introOptions:{timing,beforeStage(phase){phases.push(phase);trace();if(phase==='gathering'&&$('intro-error').checked)throw Error('DAY8 fixture presentation failure');}},revealOptions:{beforeCard(card,ctx){revealed.push({cardId:card.cardId,rarity:card.rarity,index:ctx.index});trace();if($('reveal-error').checked)throw Error('DAY9 fixture presentation failure');if($('reveal-off').checked)setTimeout(()=>{$('motion').checked=true;view.syncMotion();},100);if($('reveal-exit').checked)setTimeout(()=>{view.setVisible(false);$('gacha-screen').hidden=true;},100);}}});
let offTimer;document.addEventListener('click',e=>{if(e.target.closest('[data-confirm]')&&$('mid-off').checked){clearTimeout(offTimer);offTimer=setTimeout(()=>{$('motion').checked=true;document.body.classList.add('reduced');view.syncMotion();},600);}});
document.addEventListener('visibilitychange',()=>{visibility.push(document.hidden?'hidden':'visible');trace();});
function show(){if(location.hash!=='#gacha')history.pushState(null,'','#gacha');view.setVisible(true);$('gacha-screen').hidden=false;}
window.addEventListener('popstate',()=>{const open=location.hash==='#gacha';view.setVisible(open);$('gacha-screen').hidden=!open;});
async function seed(raw){await navigator.locks.request(key+':transaction',()=>localStorage.setItem(key,raw));store.refresh();show();}
$('seed').onclick=()=>{fixedRequestId=null;return seed(JSON.stringify({schemaVersion:1,balance:3000,claimedGrantIds:['test-crystals-v1']}));};
for(const button of document.querySelectorAll('[data-fixed]'))button.onclick=()=>{
 const type=button.dataset.fixed,count=type==='ten'?10:1;
 fixedRequestId='day9-fixed-'+type;
 const rarities=type==='ten'?['R2','R3','R4','R2','R3','R4','R2','R2','R3','R4']:[type==='retired'?'R3':type];
 const request={...drawService.quote(view.selectedBannerId,count),requestId:fixedRequestId};
 const receipt={request,results:rarities.map(rarity=>({cardId:{R2:'test-card-001',R3:'test-card-003',R4:'test-card-005'}[rarity],rarity,configVersion:request.configVersion,schemaVersion:1})),balanceBefore:3000+request.cost,balanceAfter:3000,committedAt:1793660400000};
 if(type==='retired')receipt.results[0].cardId='retired-placeholder-card-with-an-intentionally-long-stable-id-for-wrapping-검증';
 const prior={request:{...drawService.quote(view.selectedBannerId,1),requestId:'day10-prior-r2'},results:[{cardId:'test-card-001',rarity:'R2',configVersion:request.configVersion,schemaVersion:1}],balanceBefore:receipt.balanceBefore+300,balanceAfter:receipt.balanceBefore,committedAt:receipt.committedAt};
 return seed(JSON.stringify({schemaVersion:2,balance:3000,claimedGrantIds:['test-crystals-v1'],receipts:$('owned').checked?[prior,receipt]:[receipt]}));
};
$('append').onclick=()=>store.update(wallet=>{
 if(wallet.balance<300)return {ok:false,error:'insufficient-balance'};
 const request={...drawService.quote(view.selectedBannerId,1),requestId:crypto.randomUUID()};
 const receipt={request,results:[{cardId:'test-card-005',rarity:'R4',configVersion:request.configVersion,schemaVersion:1}],balanceBefore:wallet.balance,balanceAfter:wallet.balance-300,committedAt:1793660400000};
 return {ok:true,changed:true,wallet:{...wallet,balance:receipt.balanceAfter,receipts:[...wallet.receipts,receipt],transactions:[...wallet.transactions,drawTransaction(receipt)]}};
});
$('zero').onclick=()=>seed(JSON.stringify({schemaVersion:1,balance:0,claimedGrantIds:[]}));
$('corrupt').onclick=()=>seed('{');$('future').onclick=()=>seed(JSON.stringify({schemaVersion:99}));
$('zoom').onchange=()=>document.documentElement.classList.toggle('zoomed',$('zoom').checked);
$('motion').onchange=()=>{document.body.classList.toggle('reduced',$('motion').checked);view.syncMotion();};$('show').onclick=show;
store.subscribe(s=>{$('evidence').textContent=JSON.stringify({balance:s.wallet?.balance,schemaVersion:s.wallet?.schemaVersion,receipts:s.wallet?.receipts.map(r=>({id:r.request.requestId,count:r.results.length,before:r.balanceBefore,after:r.balanceAfter})),error:s.error},null,2);trace();});
window.addEventListener('storage',e=>{if(e.key===key)store.refresh();});show();
</script></html>
